<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>03 - tag semantici e tag per i media</title>
</head>
<body>
    <h1>03 - tag semantici e tag per i media</h1>

    <!-- 
        L'html semantico è un metodo di scrittura del codice che usa tag specifici per definire chiaramente lo scopo e il significato del contenuto. 
        Vantaggi:
            - migliore accessibilità
            - codice migliore per la SEO
            - maggiore chiarezza per gli sviluppatori
            
    -->

    <!-- Intestazione della pagina o di una sezione in cima alla pagina -->
    <header></header>
    
    <!-- Menù di navigazione -->
      <nav></nav>
      <!--  Contenuto principale della pagina -->

    <main></main>

    <!-- contenuti secondati o correlati (pubblicità, box laterali, articoli simili, ecc) -->
    <aside></aside>

    <!-- Contenuto autonomo e riutilizzabile (articolo blog, scheda prodotto, ecc) -->
    <article></article>

    <!-- Raggruppamento tematico di contenuti  -->
    <section></section>

    <!-- Chiusura della pagina -->
    <footer></footer>
    
    <!-- -------------------------------- MEDIA -------------------------------- -->

    <!-- Incorporare  un video -->
     <video src="video.mp4" controls autoplay loop muted>
        <source src="../.webm" type="video/webm"> 
        <source src="../.ogg" type="video/ogg">
        Il browser non supporta il tag video 
     </video>

     <!-- Incorporare audio -->
      <audio src="audio.mp3" controls autoplay loop muted>
        <source src="../.ogg" type="audio/ogg">
        Il tuo browser non supporta l'audio richiesto
      </audio>

      <!-- Incorporare contenuti esternu (altra pagina web, mappa, video YT) -->
      <iframe src="https://www.youtube.com/watch?v=dQw4w9WgXcQ" frameborder="0"></iframe>
</body>
</html>
